<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fa" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      try {
        const theme = localStorage.getItem("finn-theme");
        if (theme === "dark") document.documentElement.dataset.theme = "dark";
      } catch {}
    </script>
    <title>FINN — Institutional intelligence</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;background:#f6f7fa;color:#1c1c1e;font-family:Inter,system-ui,sans-serif;padding:24px;text-align:center">
        <div style="max-width:420px">
          <div style="font-size:28px;margin-bottom:12px">↗ FINN</div>
          <h1 style="font-size:20px;margin:0 0 10px">Start the local web server</h1>
          <p style="color:#55555d;line-height:1.5;margin:0">This React app cannot run by double-clicking this HTML file. In Terminal, run <code>npm install</code>, then <code>npm run dev</code>, and open <code>http://localhost:5173</code>.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
