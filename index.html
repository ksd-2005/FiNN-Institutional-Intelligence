<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fa" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      try {
        const theme = localStorage.getItem("finn-theme");
        if (theme === "dark") document.documentElement.dataset.theme = "dark";
      } catch {}
    </script>
    <title>FINN — Institutional intelligence</title>
  </head>
  <body>
    <div id="root">
      <div id="startup-fallback" style="min-height:100vh;display:grid;place-items:center;background:#f6f7fa;color:#1c1c1e;font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;text-align:center">
        <div>
          <div style="width:72px;height:72px;margin:0 auto 18px;border:1px solid rgba(40,70,120,.16);border-radius:22px;background:rgba(255,255,255,.78);display:grid;place-items:center;box-shadow:0 12px 36px rgba(24,42,72,.10)">
            <img src="/assets/finn-logo.svg" alt="" width="48" height="48" />
          </div>
          <strong style="font-size:20px;letter-spacing:.18em">FINN</strong>
          <p style="margin:8px 0 0;color:#667085;font-size:13px;letter-spacing:.12em">LOADING YOUR WORKSPACE</p>
        </div>
      </div>
    </div>
    <script>
      if (document.documentElement.dataset.theme === "dark") {
        const fallback = document.getElementById("startup-fallback");
        fallback.style.background = "#090a0d";
        fallback.style.color = "#f5f6f8";
        fallback.querySelector("p").style.color = "#aeb3bf";
        const mark = fallback.querySelector("div > div");
        mark.style.background = "rgba(38,40,47,.82)";
        mark.style.borderColor = "rgba(255,255,255,.16)";
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
